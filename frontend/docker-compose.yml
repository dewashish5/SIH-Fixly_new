services:
  flutter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixly_flutter
    working_dir: /app
    volumes:
      # Mount project source code to /app
      - .:/app
      # Persistent cache for Gradle and Flutter pub so dependencies are not downloaded every time
      - flutter_pub_cache:/root/.pub-cache
      - flutter_gradle_cache:/root/.gradle
    environment:
      - CI=true
    # Default behavior when running 'docker compose up':
    # 1. Fetch flutter pub dependencies
    # 2. Build Android debug APK
    command: >
      bash -c "
        echo '===> [1/3] Checking Flutter Environment...' &&
        flutter doctor &&
        echo '===> [2/3] Getting Flutter Dependencies...' &&
        flutter pub get &&
        echo '===> [3/3] Building Android Debug APK...' &&
        flutter build apk --debug &&
        echo '' &&
        echo '=====================================================' &&
        echo ' SUCCESS: Android APK built inside Docker!' &&
        echo ' Host APK output path:' &&
        echo ' frontend/build/app/outputs/flutter-apk/app-debug.apk' &&
        echo '====================================================='
      "

volumes:
  flutter_pub_cache:
  flutter_gradle_cache:
