name: fixly
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.0.17
  geolocator: ^14.0.3
  go_router: ^18.0.0
  google_fonts: ^6.2.1
  intl: ^0.20.3
  mapbox_maps_flutter: ^2.29.1
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  transit_kit: ^1.0.0
  flutter_native_splash: ^2.4.8
  permission_handler: ^13.0.1
  geocoding: ^5.0.0
  razorpay_flutter: ^1.4.0
  firebase_core: ^4.14.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  file_picker: ^12.2.0
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F8FAFB"
  image: assets/splash_wordmark.png
  color_dark: "#F8FAFB"
  image_dark: assets/splash_wordmark.png
  android_gravity: center
  ios_content_mode: scaleAspectFit
  android_12:
    color: "#F8FAFB"
    image: assets/app_icon.png
    icon_background_color: "#F8FAFB"
    color_dark: "#F8FAFB"
    image_dark: assets/app_icon.png
    icon_background_color_dark: "#F8FAFB"
  android: true
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/config/mapbox.json
    - assets/config/firebase_client.json
    - assets/config/google-services.json
    - assets/config/GoogleService-Info.plist
    - assets/app_icon.png
    - assets/app_name.png
    - assets/splash_wordmark.png
    - assets/icons/google.svg
    - assets/icons/facebook.svg
    - assets/icons/start.png
    - assets/icons/stop.png
    - assets/icons/bike_marker.png
