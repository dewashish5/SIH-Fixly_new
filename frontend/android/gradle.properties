# Keep heap modest — 8G × multiple daemons was freezing the Mac.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# mapbox_maps_flutter 2.29.1 assumes AGP 9 → built-in Kotlin (skips kotlin-android).
# Flutter default false leaves no kotlin{} extension → build fails.
android.builtInKotlin=true

# One daemon, limited workers — avoids RAM spikes during flutter run + IDE builds.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m

