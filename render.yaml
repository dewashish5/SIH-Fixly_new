# Render Blueprint — free web services for Fixly ML
# Dashboard: New → Blueprint → connect this repo
# https://dashboard.render.com/blueprints

services:
  - type: web
    name: fixly-service-discovery
    runtime: docker
    plan: free
    rootDir: ai_ml/service_discovery
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"

  - type: web
    name: fixly-identity-verification
    runtime: docker
    plan: free
    rootDir: ai_ml/identity_verification
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
