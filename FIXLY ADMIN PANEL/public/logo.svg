<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#15803d" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer glowing hexagon badge -->
  <path d="M 50,8 L 86,28 L 86,72 L 50,92 L 14,72 L 14,28 Z" fill="#eaf7ee" stroke="#22864c" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#22864c" stroke-width="3.5" stroke-dasharray="8 4" opacity="0.6"/>
  
  <!-- Core emblem: cooperative shaking hands & cog / gear / camera / leaf -->
  <circle cx="50" cy="50" r="18" fill="url(#logoGrad)" filter="url(#glow)"/>
  
  <!-- Center symbol -->
  <path d="M42 46 C42 42, 58 42, 58 46 C58 52, 42 52, 42 58 C42 62, 58 62, 58 58" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
</svg>
