function useLocalStorage(key, initialValue) {
  const [storedValue, setStoredValue] = useState(() => {
    try {
      const item = window.localStorage.getItem(key);
      return item ? JSON.parse(item) : initialValue;
    } catch (error) {
      console.warn('Error reading localStorage', error);
      return initialValue;
    }
  });
  const setValue = (value) => {
    try {
      const valueToStore = value instanceof Function ? value(storedValue) : value;
      setStoredValue(valueToStore);
      window.localStorage.setItem(key, JSON.stringify(valueToStore));
    } catch (error) {
      console.warn('Error setting localStorage', error);
    }
  };
  return [storedValue, setValue];
}

/* ── App ────────────────────────────────────────────────────── */

  /* toast */

    setToast({ msg, type });
    setTimeout(() => setToast(null), 3000);
  };

  /* modals state */
  const [bookingModal,  setBookingModal]  = useState(null);   // booking object
  const [workerModal,   setWorkerModal]   = useState(null);   // worker object
  const [invoiceModal,  setInvoiceModal]  = useState(null);   // payment object
  const [addWorkerOpen, setAddWorkerOpen] = useState(false);
  const [addSvcOpen,    setAddSvcOpen]    = useState(false);
  const [notifOpen,     setNotifOpen]     = useState(false);
  const [assignModal,   setAssignModal]   = useState(null);   // booking to assign
  const [reschedModal,  setReschedModal]  = useState(null);   // booking to reschedule
  const [cancelModal,   setCancelModal]   = useState(null);   // booking to cancel

  const t = (k) => TR[lang][k] || TR.en[k] || k;

  const NAV = [
    {id:'dashboard',     label:t('dashboard'),     icon:'📊'},
    {id:'bookings',      label:t('bookings'),       icon:'📅'},
    {id:'workers',       label:t('workers'),        icon:'👷'},
    {id:'customers',     label:t('customers'),      icon:'👥'},
    {id:'services',      label:t('services'),       icon:'🛠️'},
    {id:'payments',      label:t('payments'),       icon:'💳'},
    {id:'insurance',     label:t('insurance'),      icon:'🛡️'},
    {id:'reviews',       label:t('reviews'),        icon:'⭐'},
    {id:'reports',       label:t('reports'),        icon:'📑'},
    {id:'analytics',     label:t('analytics'),      icon:'📈'},
    {id:'ai-insights',   label:t('aiInsights'),     icon:'🧠'},
    {id:'notifications', label:t('notifications'),  icon:'🔔'},
    {id:'settings',      label:t('settings'),       icon:'⚙️'},
  ];

  /* ── Dynamic Dashboard Statistics ── */
  const calcTotalRevenue = () => {
    const total = payments.filter(p => p.status === 'Completed').reduce((sum, p) => sum + parseFloat(String(p.amount).replace(/[^0-9.-]+/g, "") || 0), 0);
    return '₹' + total.toLocaleString('en-IN');
  };
  const activeWorkersCount = workers.filter(w => w.verification === 'Verified' && w.availability !== 'Inactive').length;

  /* Dashboard Chart Helper (Last 7 Days) */
  const chartPts = useMemo(() => {
    const last7 = Array.from({length:7}, (_,i) => {
      const d = new Date(); d.setDate(d.getDate() - (6 - i));
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    });
    const counts = {};
    bookings.forEach(b => {
      const dMatch = String(b.date).match(/(\d{1,2}\s[a-zA-Z]{3})/);
      const dStr = dMatch ? dMatch[0] : null;
      if (dStr) counts[dStr] = (counts[dStr] || 0) + 1;
    });
    let maxV = Math.max(...Object.values(counts), 5); // Ensure non-zero divisor
    return last7.map((date, i) => {
      const v = counts[date] || 0;
      return { date, v, x: 45+(i/6)*545, y: 25+165-(v/maxV)*165, maxV };
    });
  }, [bookings]);

  const { line, area, maxChartV } = useMemo(() => {
    if(!chartPts || chartPts.length === 0) return {line:'', area:'', maxChartV:5};
    let l = `M ${chartPts[0].x} ${chartPts[0].y}`;
    for(let i=0;i<chartPts.length-1;i++){
      const a=chartPts[i], b=chartPts[i+1];
      l += ` C ${a.x+(b.x-a.x)/2} ${a.y}, ${a.x+(b.x-a.x)/2} ${b.y}, ${b.x} ${b.y}`;
    }
    const a = `${l} L ${chartPts[chartPts.length-1].x} 190 L ${chartPts[0].x} 190 Z`;
    return { line: l, area: a, maxChartV: chartPts[0].maxV };
  }, [chartPts]);

  /* Dynamic Top Services */
  const dashboardTopServices = useMemo(() => {
    const counts = {};
    bookings.forEach(b => { counts[b.service] = (counts[b.service]||0) + 1; });
    const total = Math.max(bookings.length, 1);
    return Object.entries(counts).map(([cat, c]) => ({
      category: cat, pct: Math.round((c/total)*100),
      icon: services.find(s=>s.name===cat || s.category===cat)?.icon || '🛠️'
    })).sort((a,b)=>b.pct - a.pct).slice(0,6);
  }, [bookings, services]);

  /* ── render ──────────────────────────────────────────────── */
  return (
    <div style={{ display:'flex', minHeight:'100vh', position:'relative' }}>

      {/* ── Toast ── */}
      {toast && (
        <div className="fade" style={{ position:'fixed', top:'20px', right:'24px', backgroundColor: toast.type==='error'?'#dc2626':'var(--primary)', color:'#fff', padding:'12px 20px', borderRadius:'10px', boxShadow:'0 10px 25px rgba(0,0,0,0.25)', zIndex:99999, fontWeight:'600', fontSize:'13px', display:'flex', alignItems:'center', gap:'8px' }}>
          {toast.type==='error'?'✗':'✓'} {toast.msg}
        </div>
      )}

      {/* ── Mobile Sidebar Overlay ── */}
      <div className={`sidebar-overlay ${sidebarOpen?'open':''}`} onClick={()=>setSidebarOpen(false)} />

      {/* ── Sidebar ── */}
      <aside className={`app-sidebar ${sidebarOpen?'open':''} ${sidebarCollapsed?'collapsed':''}`} style={{ width:'var(--sidebar-w)', height:'100vh', position:'sticky', top:0, backgroundColor:'var(--bg-card)', borderRight:'1px solid var(--border)', display:'flex', flexDirection:'column', justifyContent:'space-between', padding:'20px 12px 20px 16px', flexShrink:0, overflowY:'auto', overflowX:'hidden' }}>
        <div>
          {/* Logo + Collapse toggle */}
          <div style={{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'24px' }}>
            <div style={{ width:'38px', height:'38px', borderRadius:'10px', background:'linear-gradient(135deg,#01668F,#3398C5)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'20px', flexShrink:0, cursor:'pointer' }} onClick={()=>navigate('dashboard')}>🛠️</div>
            <div className="sidebar-logo-text" style={{ flex:1, overflow:'hidden' }}>
              <div style={{ fontWeight:'800', fontSize:'14px', color:'var(--text)', letterSpacing:'-0.3px', whiteSpace:'nowrap' }}>Cooperative</div>
              <div style={{ fontSize:'11px', color:'var(--text-muted)', fontWeight:'500', whiteSpace:'nowrap' }}>Gig Services Platform</div>
            </div>
            <button className="sidebar-collapse-btn" title="Toggle sidebar" onClick={()=>setSidebarCollapsed(v=>!v)}>
              {sidebarCollapsed ? '›' : '‹'}
            </button>
          </div>
          <nav style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
            {NAV.map(n => {
              const active = route===n.id;
              return (
                <button key={n.id} title={n.label} onClick={()=>navigate(n.id)} style={{ display:'flex', alignItems:'center', gap:'10px', padding:'9px 12px', borderRadius:'10px', fontSize:'13px', fontWeight:active?'700':'500', color:active?'#fff':'var(--text-sec)', backgroundColor:active?'var(--primary)':'transparent', boxShadow:active?'0 4px 14px rgba(1,102,143,0.28)':'none', textAlign:'left', width:'100%', transition:'all 0.15s', overflow:'hidden' }}>
                  <span style={{ fontSize:'16px', flexShrink:0 }}>{n.icon}</span>
                  <span className="sidebar-label" style={{ whiteSpace:'nowrap' }}>{n.label}</span>
                  {n.id==='notifications' && notifications.filter(x=>x.unread).length > 0 && (
                    <span className="sidebar-badge" style={{ marginLeft:'auto', backgroundColor:'#dc2626', color:'#fff', borderRadius:'999px', fontSize:'10px', fontWeight:'700', padding:'1px 6px', flexShrink:0 }}>{notifications.filter(x=>x.unread).length}</span>
                  )}
                </button>
              );
            })}
          </nav>
        </div>
      </aside>

      {/* ── Main ── */}
      <div className="app-main" style={{ flex:1, display:'flex', flexDirection:'column', minHeight:'100vh', overflowY:'auto', overflowX:'hidden' }}>

        {/* Header */}
        <header style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 24px', flexWrap:'wrap', gap:'10px', backgroundColor:'var(--bg-card)', borderBottom:'1px solid var(--border)', position:'sticky', top:0, zIndex:100 }}>
          <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
            {/* Hamburger (mobile only) */}
            <button className="hamburger-btn" onClick={()=>setSidebarOpen(v=>!v)}>
              <span/><span/><span/>
            </button>
            <div>
              <h1 style={{ fontSize:'18px', fontWeight:'700', color:'var(--primary)', lineHeight:'1.2' }}>{t('welcome')}</h1>
              <p style={{ fontSize:'12px', color:'var(--text-sec)', marginTop:'1px' }}>{t('tagline')}</p>
            </div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:'8px', flexWrap:'wrap' }}>
            {/* Language */}
            <div style={{ position:'relative' }}>
              <button onClick={()=>setLangOpen(v=>!v)} style={{ display:'flex', alignItems:'center', gap:'6px', padding:'6px 12px', backgroundColor:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:'999px', fontSize:'12px', fontWeight:'600', color:'var(--text)' }}>
                🌐 {lang==='en'?'EN':lang==='hi'?'HI':'MR'} ▾
              </button>
              {langOpen && (
                <div style={{ position:'absolute', top:'110%', right:0, backgroundColor:'var(--bg-card)', borderRadius:'10px', border:'1px solid var(--border)', boxShadow:'0 10px 25px rgba(0,0,0,0.1)', padding:'4px', zIndex:400, width:'120px' }}>
                  {[['en','English'],['hi','हिंदी'],['mr','मराठी']].map(([code,label])=>(
                    <button key={code} onClick={()=>{setLang(code);setLangOpen(false);showToast(`Switched to ${label}`);}} style={{ display:'block', width:'100%', padding:'7px 10px', fontSize:'12.5px', textAlign:'left', fontWeight:lang===code?'700':'500', color:lang===code?'var(--primary)':'var(--text)', borderRadius:'6px', backgroundColor:lang===code?'var(--primary-light)':'transparent' }}>{label}</button>
                  ))}
                </div>
              )}
            </div>
            {/* Date filter */}
            <div style={{ position:'relative' }}>
              <button onClick={()=>setDateOpen(v=>!v)} style={{ display:'flex', alignItems:'center', gap:'6px', padding:'6px 12px', backgroundColor:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:'999px', fontSize:'12px', fontWeight:'600', color:'var(--text)' }}>
                📅 {dateRange} ▾
              </button>
              {dateOpen && (
                <div style={{ position:'absolute', top:'110%', right:0, backgroundColor:'var(--bg-card)', borderRadius:'10px', border:'1px solid var(--border)', boxShadow:'0 10px 25px rgba(0,0,0,0.1)', padding:'4px', zIndex:400, width:'170px' }}>
                  {['Aug 28, 2026','Last 7 Days','This Month','This Year'].map(d=>(
                    <button key={d} onClick={()=>{setDateRange(d);setDateOpen(false);showToast(`Filter: ${d}`);}} style={{ display:'block', width:'100%', padding:'7px 10px', fontSize:'12.5px', textAlign:'left', fontWeight:dateRange===d?'700':'500', color:dateRange===d?'var(--primary)':'var(--text)', borderRadius:'6px', backgroundColor:dateRange===d?'var(--primary-light)':'transparent' }}>{d}</button>
                  ))}
                </div>
              )}
            </div>
            {/* Bell */}

              {notifications.filter(x=>x.unread).length>0 && <span style={{ position:'absolute', top:'2px', right:'2px', width:'9px', height:'9px', backgroundColor:'#dc2626', borderRadius:'50%', border:'1.5px solid #fff' }}/>}
            </button>
            {/* Profile */}

              <span style={{ fontSize:'13px', fontWeight:'600' }}>Admin</span>
            </div>
          </div>
        </header>

        {/* ══════════════════════════════════════════════════════ */}
        {/* ROUTE: DASHBOARD */}

        {route==='dashboard' && (
          <div className="fade" style={{ display:'flex', flexDirection:'column', gap:'22px', padding:'20px 20px 40px' }}>

              {[
                {title:'Total Bookings', value:bookings.length.toLocaleString('en-IN'),  trend:'Live Data', icon:'📅', clr:'var(--primary)'},

                      <div style={{ fontSize:'22px', fontWeight:'800', color:'var(--text)', letterSpacing:'-0.5px' }}>{s.value}</div>

                    </div>
                  </div>
                  <div style={{ fontSize:'12px', fontWeight:'700', color:s.clr, paddingLeft:'58px' }}>{s.trend} this month</div>
                </div>
              ))}
            </div>

            {/* Chart + Top Services */}
            <div className="mg" style={{ display:'grid', gridTemplateColumns:'1.65fr 1fr', gap:'18px' }}>
              <div style={{ backgroundColor:'#fff', borderRadius:'16px', border:'1px solid var(--border)', padding:'22px 24px', boxShadow:'var(--shadow)' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'16px' }}>
                  <h2 style={{ fontSize:'15.5px', fontWeight:'700', color:'var(--text)' }}>Bookings Overview — This Week</h2>
                </div>
                <svg viewBox="0 0 620 220" style={{ width:'100%', height:'auto' }}>
                  <defs>
                  <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#01668F" stopOpacity=".20"/>
                      <stop offset="100%" stopColor="#01668F" stopOpacity="0"/>
                    </linearGradient>
                  </defs>
                  {[{v:maxChartV,l:maxChartV},{v:maxChartV*0.75,l:(maxChartV*0.75).toFixed(1)},{v:maxChartV*0.5,l:(maxChartV*0.5).toFixed(1)},{v:maxChartV*0.25,l:(maxChartV*0.25).toFixed(1)},{v:0,l:'0'}].map(({v,l})=>{
                    const yy = 25+165-(v/maxChartV)*165;
                    return (
                      <g key={v}>
                        <line x1="45" y1={yy} x2="590" y2={yy} stroke="#f1f5f3" strokeWidth="1.2" strokeDasharray={v===0?'none':'3 3'}/>
                        <text x="38" y={yy+4} textAnchor="end" fontSize="11" fill="#8c9e94">{l}</text>
                      </g>
                    );
                  })}
                  <path d={area} fill="url(#g1)"/>
                  <path d={line} fill="none" stroke="#22864c" strokeWidth="3" strokeLinecap="round"/>
                  {chartPts.map((pt,i)=>(
                    <g key={i}>
                      <text x={pt.x} y="212" textAnchor="middle" fontSize="11" fill="#8c9e94">{pt.date}</text>
                      <circle cx={pt.x} cy={pt.y} r="4.5" fill="#22864c" stroke="#fff" strokeWidth="2.5"/>
                    </g>
                  ))}
                </svg>
              </div>
              <div style={{ backgroundColor:'var(--bg-card)', borderRadius:'16px', border:'1px solid var(--border)', padding:'22px 24px', boxShadow:'var(--shadow)' }}>

        }} style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
          <div><label style={{ fontSize:'12px', fontWeight:'600', color:'#475569', display:'block', marginBottom:'4px' }}>Title *</label><Input name="title" required placeholder="e.g. Surge Alert in Sector 15"/></div>
          <div><label style={{ fontSize:'12px', fontWeight:'600', color:'#475569', display:'block', marginBottom:'4px' }}>Message *</label><textarea name="msg" rows={3} required placeholder="Notification body..." style={{ width:'100%', padding:'9px 12px', borderRadius:'8px', border:'1px solid #cbd5e1', fontSize:'13px', resize:'vertical' }}/></div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px' }}>
            <div><label style={{ fontSize:'12px', fontWeight:'600', color:'#475569', display:'block', marginBottom:'4px' }}>Category</label>
              <select name="category" style={{ width:'100%', padding:'9px 12px', borderRadius:'8px', border:'1px solid #cbd5e1', fontSize:'13px' }}>

            </div>
          </div>

      {/* Assign Worker Modal */}
      <Modal open={!!assignModal} onClose={()=>setAssignModal(null)} title="Assign Worker to Booking" subtitle={assignModal?.id} maxW="460px"
        footer={<><Btn variant="secondary" onClick={()=>setAssignModal(null)}>Cancel</Btn><Btn onClick={()=>{showToast(`Worker assigned to ${assignModal?.id}`);setAssignModal(null);}}>Confirm Assignment</Btn></>}>
        {assignModal && (
          <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
            <div style={{ fontSize:'13px', color:'#475569' }}>Select an available worker for <strong>{assignModal.service}</strong></div>
            {workers.filter(w=>w.availability==='Available').slice(0,4).map(w=>(
              <div key={w.id} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 14px', backgroundColor:'#f8faf9', borderRadius:'10px', border:'1px solid #e2e8f0', fontSize:'13px' }}>
                <div>
                  <div style={{ fontWeight:'700' }}>{w.name}</div>
                  <div style={{ fontSize:'11.5px', color:'#64748b' }}>{w.service} · ⭐ {w.rating} · 📍 {w.location}</div>
                </div>
                <button onClick={()=>{
                  setBookings(bs=>bs.map(b=>b.id===assignModal.id?{...b,worker:w.name,workerId:w.id,status:'Assigned'}:b));
                  showToast(`${w.name} assigned to ${assignModal.id}`);
                  setAssignModal(null);
                }} style={{ padding:'6px 12px', backgroundColor:'var(--primary)', color:'#fff', borderRadius:'6px', fontSize:'12px', fontWeight:'600', cursor:'pointer' }}>
                  Assign
                </button>

            ))}

      {/* Reschedule Modal */}
      <Modal open={!!reschedModal} onClose={()=>setReschedModal(null)} title="Reschedule Booking" subtitle={reschedModal?.id} maxW="420px"
        footer={<><Btn variant="secondary" onClick={()=>setReschedModal(null)}>Cancel</Btn><Btn onClick={()=>document.getElementById('reschedForm').requestSubmit()}>Confirm Reschedule</Btn></>}>
        {reschedModal && (
          <form id="reschedForm" onSubmit={e=>{
            e.preventDefault();
            const fd = new FormData(e.target);
            showToast(`Booking ${reschedModal.id} rescheduled to ${fd.get('date')} at ${fd.get('slot')}`);
            setReschedModal(null);
          }} style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
            <div><label style={{ fontSize:'12px', fontWeight:'600', color:'#475569', display:'block', marginBottom:'4px' }}>New Date *</label><Input type="date" name="date" required min={new Date().toISOString().split('T')[0]}/></div>
            <div><label style={{ fontSize:'12px', fontWeight:'600', color:'#475569', display:'block', marginBottom:'4px' }}>Time Slot *</label>
              <select name="slot" style={{ width:'100%', padding:'9px 12px', borderRadius:'8px', border:'1px solid #cbd5e1', fontSize:'13px' }}>
                {['08:00 AM','09:00 AM','10:00 AM','11:00 AM','12:00 PM','02:00 PM','03:00 PM','04:00 PM','05:00 PM'].map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </form>
        )}
      </Modal>

      {/* Cancel Confirm Modal */}
      <Modal open={!!cancelModal} onClose={()=>setCancelModal(null)} title="Cancel this Booking?" subtitle="This action will issue a full escrow refund." maxW="400px"
        footer={<><Btn variant="secondary" onClick={()=>setCancelModal(null)}>Keep Booking</Btn><Btn variant="danger" onClick={()=>{
          setBookings(bs=>bs.map(b=>b.id===cancelModal.id?{...b,status:'Cancelled'}:b));
          showToast(`Booking ${cancelModal.id} cancelled. Refund initiated.`,'success');
          setCancelModal(null);
        }}>Confirm Cancellation</Btn></>}>
        {cancelModal && (
          <div style={{ fontSize:'13px', color:'#475569' }}>
            <p>You are about to cancel booking <strong>{cancelModal.id}</strong> for <strong>{cancelModal.customer}</strong>.</p>
            <div style={{ backgroundColor:'#fef2f2', padding:'12px', borderRadius:'8px', border:'1px solid #fecaca', marginTop:'12px', color:'#dc2626', fontWeight:'600', fontSize:'12.5px' }}>
              ⚠️ A full refund of {cancelModal.amount} will be issued and the assigned worker will be released.
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ── Sub-route Components ─────────────────────────────────── */

function PageHeader({title, desc, children}) {
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'20px', flexWrap:'wrap', gap:'12px' }}>
      <div>
        <h2 style={{ fontSize:'20px', fontWeight:'700', color:'#111827' }}>{title}</h2>
        {desc && <p style={{ fontSize:'13px', color:'#64748b', marginTop:'2px' }}>{desc}</p>}
      </div>
      <div style={{ display:'flex', gap:'10px' }}>{children}</div>
    </div>
  );
}

function Page({children, style:s={}}) {
  return <div className="fade" style={{ padding:'28px 32px 40px', ...s }}>{children}</div>;
}

function FilterBar({children}) {
  return <div style={{ backgroundColor:'#fff', padding:'12px 16px', borderRadius:'12px', border:'1px solid var(--border)', display:'flex', alignItems:'center', gap:'10px', marginBottom:'16px', flexWrap:'wrap' }}>{children}</div>;
}

function Pill({label, active, onClick}) {
  return <button onClick={onClick} style={{ padding:'5px 12px', borderRadius:'8px', fontSize:'12.5px', fontWeight:'600', backgroundColor:active?'#eaf7ee':'transparent', color:active?'var(--primary)':'#64748b', border:`1px solid ${active?'#86efac':'transparent'}`, cursor:'pointer' }}>{label}</button>;
}

function Table({heads, children}) {
  return (
    <div style={{ backgroundColor:'#fff', borderRadius:'14px', border:'1px solid var(--border)', overflow:'hidden', boxShadow:'var(--shadow)' }}>
      <table style={{ width:'100%', borderCollapse:'collapse', textAlign:'left' }}>
        <thead>
          <tr style={{ backgroundColor:'#f8faf9', borderBottom:'1px solid #e6ede8', color:'#55695e', fontSize:'12px', fontWeight:'700' }}>
            {heads.map((h,i)=><th key={i} style={{ padding:'14px 18px', textAlign:h.right?'right':'left' }}>{h.label}</th>)}
          </tr>
        </thead>
        <tbody>{children}</tbody>
      </table>
    </div>
  );
}

function TR2({onClick, children}) {
  return <tr onClick={onClick} style={{ borderBottom:'1px solid #f1f5f3', fontSize:'13px', cursor:onClick?'pointer':'default' }}
             onMouseEnter={onClick?e=>e.currentTarget.style.backgroundColor='#f9fbf9':undefined}
             onMouseLeave={onClick?e=>e.currentTarget.style.backgroundColor='transparent':undefined}>{children}</tr>;
}

function TD({right, children, style:s={}}) {
  return <td style={{ padding:'13px 18px', textAlign:right?'right':'left', ...s }}>{children}</td>;
}

function ActionBtn({icon, bg, color, onClick, title}) {
  return <button title={title} onClick={onClick} style={{ padding:'6px 8px', backgroundColor:bg||'#f1f5f9', color:color||'#475569', borderRadius:'6px', fontSize:'14px', cursor:'pointer' }}>{icon}</button>;
}

/* Bookings Route */
function BookingsRoute({bookings,setBookings,setBookingModal,setAssignModal,setReschedModal,setCancelModal,showToast}) {
  const [search, setSearch] = useState('');
  const [statusF, setStatusF] = useState('All');
  const [serviceF, setServiceF] = useState('All');

  const filtered = useMemo(()=>bookings.filter(b=>{
    const s = (statusF==='All'||b.status===statusF);
    const sv = (serviceF==='All'||b.service===serviceF);
    const q = !search || [b.id,b.customer,b.worker,b.service].join(' ').toLowerCase().includes(search.toLowerCase());
    return s&&sv&&q;
  }),[bookings,search,statusF,serviceF]);

  const exportCSV = () => {
    const rows = ['ID,Customer,Service,Worker,Amount,Status,Date'].concat(bookings.map(b=>`${b.id},"${b.customer}",${b.service},"${b.worker}",${b.amount},${b.status},${b.date}`));
    const a = document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(rows.join('\n')); a.download='bookings.csv'; a.click();
    showToast('Bookings CSV exported!');
  };

  return (
    <Page>
      <PageHeader title={`Bookings & Dispatch (${bookings.length})`} desc="Manage bookings, assign workers, reschedule and cancel">
        <Btn variant="secondary" onClick={exportCSV}>⬇️ Export CSV</Btn>
      </PageHeader>
      <FilterBar>
        <SearchInput value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search ID, customer, worker..."/>
        <select value={serviceF} onChange={e=>setServiceF(e.target.value)} style={{ padding:'7px 10px', borderRadius:'8px', border:'1px solid #cbd5e1', fontSize:'12.5px', backgroundColor:'#fff' }}>
          <option value="All">All Services</option>
          {['Plumbing','Electrical','Carpentry','Cleaning','AC Repair','Caregiving'].map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <div style={{ display:'flex', gap:'4px', flexWrap:'wrap' }}>
          {['All','Confirmed','Pending','In Progress','Completed','Cancelled','Emergency','Assigned'].map(st=>(
            <Pill key={st} label={st} active={statusF===st} onClick={()=>setStatusF(st)}/>
          ))}
        </div>
      </FilterBar>
      <Table heads={[{label:'Booking ID'},{label:'Customer & Address'},{label:'Service'},{label:'Worker'},{label:'Amount'},{label:'Status'},{label:'Actions',right:true}]}>
        {filtered.map(b=>(
          <TR2 key={b.id}>
            <TD><span onClick={()=>setBookingModal(b)} style={{ color:'var(--text-link)', fontWeight:'700', cursor:'pointer' }}>{b.id}</span><div style={{ fontSize:'11px', color:'#94a3b8' }}>{b.date} · {b.time}</div></TD>
            <TD><div style={{ fontWeight:'700' }}>{b.customer}</div><div style={{ fontSize:'11px', color:'#64748b', maxWidth:'220px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{b.customerAddress}</div></TD>
            <TD><div style={{ fontWeight:'600' }}>{b.service}</div><div style={{ fontSize:'11px', color:'#64748b' }}>{b.serviceType}</div></TD>
            <TD><div style={{ fontWeight:'600' }}>{b.worker}</div><div style={{ fontSize:'11px', color:'var(--primary)' }}>⭐ {b.workerRating}</div></TD>
            <TD><span style={{ fontWeight:'800' }}>{b.amount}</span></TD>
            <TD><Badge st={b.status}/></TD>
            <TD right>
              <div style={{ display:'flex', gap:'6px', justifyContent:'flex-end' }}>
                <ActionBtn icon="👁️" bg="#f1f8f3" color="var(--primary)" title="View details" onClick={()=>setBookingModal(b)}/>
                <ActionBtn icon="👤" bg="#eff6ff" color="#2563eb" title="Assign worker" onClick={()=>setAssignModal(b)}/>
                <ActionBtn icon="📅" bg="#f8fafc" color="#475569" title="Reschedule" onClick={()=>setReschedModal(b)}/>
                {b.status!=='Cancelled' && <ActionBtn icon="🚫" bg="#fef2f2" color="#dc2626" title="Cancel" onClick={()=>setCancelModal(b)}/>}
              </div>
            </TD>
          </TR2>
        ))}
      </Table>
    </Page>
  );
}

/* Workers Route */
function WorkersRoute({workers,setWorkers,setWorkerModal,setAddWorkerOpen,showToast}) {
  const [search, setSearch] = useState('');
  const [serviceF, setServiceF] = useState('All');
  const [verF, setVerF] = useState('All');

  const filtered = useMemo(()=>workers.filter(w=>{
    const sv = serviceF==='All'||w.service===serviceF;
    const vr = verF==='All'||w.verification===verF;
    const q = !search || [w.name,w.service,w.location].join(' ').toLowerCase().includes(search.toLowerCase());
    return sv&&vr&&q;
  }),[workers,search,serviceF,verF]);

  const verify = (id) => { setWorkers(ws=>ws.map(w=>w.id===id?{...w,verification:'Verified'}:w)); showToast('Worker verified!'); };
  const suspend = (id) => { setWorkers(ws=>ws.map(w=>w.id===id?{...w,verification:'Suspended'}:w)); showToast('Worker suspended.'); };
  const reject = (id) => { setWorkers(ws=>ws.map(w=>w.id===id?{...w,verification:'Rejected'}:w)); showToast('Worker rejected.'); };

  return (
    <Page>
      <PageHeader title={`Cooperative Workers (${workers.length})`} desc="Member verification, telemetry tracking, welfare status">
        <Btn onClick={()=>setAddWorkerOpen(true)}>+ Onboard Member</Btn>
      </PageHeader>
      <FilterBar>
        <SearchInput value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search worker, trade, city..."/>
        <select value={serviceF} onChange={e=>setServiceF(e.target.value)} style={{ padding:'7px 10px', borderRadius:'8px', border:'1px solid #cbd5e1', fontSize:'12.5px', backgroundColor:'#fff' }}>
          <option value="All">All Trades</option>
          {['Plumbing','Electrical','Carpentry','Cleaning','AC Repair','Caregiving'].map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <select value={verF} onChange={e=>setVerF(e.target.value)} style={{ padding:'7px 10px', borderRadius:'8px', border:'1px solid #cbd5e1', fontSize:'12.5px', backgroundColor:'#fff' }}>
          <option value="All">All Verification</option>
          {['Verified','Pending','Rejected','Suspended'].map(v=><option key={v} value={v}>{v}</option>)}
        </select>
      </FilterBar>
      <Table heads={[{label:'Worker'},{label:'Trade & Skills'},{label:'Location'},{label:'Rating'},{label:'Jobs'},{label:'Status'},{label:'Verification'},{label:'Actions',right:true}]}>
        {filtered.map(w=>(
          <TR2 key={w.id}>
            <TD>
              <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                <img src={w.avatar} alt={w.name} style={{ width:'36px', height:'36px', borderRadius:'50%', objectFit:'cover', border:'2px solid #22c55e' }}/>
                <div>
                  <div style={{ fontWeight:'700', color:'var(--text-link)', cursor:'pointer' }} onClick={()=>setWorkerModal(w)}>{w.name}</div>
                  <div style={{ fontSize:'11px', color:'#64748b' }}>{w.id} · {w.phone}</div>
                </div>
              </div>
            </TD>
            <TD><div style={{ fontWeight:'700' }}>{w.service}</div><div style={{ fontSize:'11px', color:'#64748b', maxWidth:'160px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{w.skills.join(', ')}</div></TD>
            <TD>{w.location}<div style={{ fontSize:'11px', color:'#94a3b8' }}>{w.city}</div></TD>
            <TD><span style={{ fontWeight:'700', color:'var(--primary)' }}>★ {w.rating}</span></TD>
            <TD><span style={{ fontWeight:'700' }}>{w.completedJobs}</span></TD>
            <TD><Badge st={w.availability}/></TD>
            <TD><Badge st={w.verification}/></TD>
            <TD right>
              <div style={{ display:'flex', gap:'6px', justifyContent:'flex-end' }}>
                <ActionBtn icon="👁️" bg="#f1f8f3" color="var(--primary)" title="View profile" onClick={()=>setWorkerModal(w)}/>
                {w.verification!=='Verified' && <ActionBtn icon="✅" bg="#eaf8ef" color="#15803d" title="Verify" onClick={()=>verify(w.id)}/>}
                {w.verification==='Pending' && <ActionBtn icon="❌" bg="#fef2f2" color="#dc2626" title="Reject" onClick={()=>reject(w.id)}/>}
                {w.verification==='Verified' && <ActionBtn icon="🚫" bg="#fef2f2" color="#dc2626" title="Suspend" onClick={()=>suspend(w.id)}/>}
              </div>
            </TD>
          </TR2>
        ))}
      </Table>
    </Page>
  );
}

/* Customers Route */
function CustomersRoute({customers,setCustomers,bookings,showToast}) {
  const [search, setSearch] = useState('');
  const [statusF, setStatusF] = useState('All');
  const [custDetail, setCustDetail] = useState(null);

  const filtered = useMemo(()=>customers.filter(c=>{
    const st = statusF==='All'||c.status===statusF;
    const q = !search || [c.name,c.phone,c.email,c.address].join(' ').toLowerCase().includes(search.toLowerCase());
    return st&&q;
  }),[customers,search,statusF]);

  const toggleBlock = (id) => {
    setCustomers(cs=>cs.map(c=>c.id===id?{...c,status:c.status==='Blocked'?'Active':'Blocked'}:c));
    showToast('Customer status updated.');
  };

  const custBookings = (name) => bookings.filter(b=>b.customer===name);

  return (
    <Page>
      <PageHeader title={`Customer Directory (${customers.length})`} desc="Lifetime spending, ratings, and account management"/>
      <FilterBar>
        <SearchInput value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, phone, email..."/>
        <div style={{ display:'flex', gap:'4px' }}>
          {['All','Active','VIP','Blocked'].map(s=><Pill key={s} label={s} active={statusF===s} onClick={()=>setStatusF(s)}/>)}
        </div>
      </FilterBar>
      <Table heads={[{label:'Customer'},{label:'Contact'},{label:'Bookings'},{label:'Lifetime Spend'},{label:'Rating'},{label:'Status'},{label:'Actions',right:true}]}>
        {filtered.map(c=>(
          <TR2 key={c.id}>
            <TD><div style={{ fontWeight:'700', color:'var(--text-link)', cursor:'pointer' }} onClick={()=>setCustDetail(c)}>{c.name}</div><div style={{ fontSize:'11px', color:'#64748b' }}>{c.id} · Since {c.memberSince}</div></TD>
            <TD><div>{c.phone}</div><div style={{ fontSize:'11.5px', color:'#64748b' }}>{c.email}</div></TD>
            <TD><span style={{ fontWeight:'700' }}>{c.totalBookings} tasks</span></TD>
            <TD><span style={{ fontWeight:'800', color:'var(--primary)' }}>{c.totalSpent}</span></TD>
            <TD><span style={{ fontWeight:'700', color:'#ca8a04' }}>★ {c.rating}</span></TD>
            <TD><Badge st={c.status}/></TD>
            <TD right>
              <div style={{ display:'flex', gap:'6px', justifyContent:'flex-end' }}>
                <ActionBtn icon="👁️" bg="#f1f8f3" color="var(--primary)" title="View details" onClick={()=>setCustDetail(c)}/>
                <ActionBtn icon={c.status==='Blocked'?'✅':'🚫'} bg={c.status==='Blocked'?'#eaf8ef':'#fef2f2'} color={c.status==='Blocked'?'var(--primary)':'#dc2626'} title={c.status==='Blocked'?'Unblock':'Block'} onClick={()=>toggleBlock(c.id)}/>
              </div>
            </TD>
          </TR2>
        ))}
      </Table>

      {/* Customer Detail Modal inline */}
      <Modal open={!!custDetail} onClose={()=>setCustDetail(null)} title={custDetail?.name} subtitle={`${custDetail?.id} · Member since ${custDetail?.memberSince}`} maxW="600px"
        footer={<><Btn variant="secondary" onClick={()=>{toggleBlock(custDetail.id);setCustDetail(null);}}>{custDetail?.status==='Blocked'?'Unblock Account':'Block Account'}</Btn><Btn onClick={()=>setCustDetail(null)}>Close</Btn></>}>
        {custDetail && (
          <div style={{ display:'flex', flexDirection:'column', gap:'14px', fontSize:'13px' }}>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'10px' }}>
              {[['Total Bookings',custDetail.totalBookings+' tasks'],['Lifetime Spend',custDetail.totalSpent],['Avg Rating','★ '+custDetail.rating]].map(([k,v])=>(
                <div key={k} style={{ backgroundColor:'#f8faf9', padding:'12px', borderRadius:'10px', textAlign:'center' }}>
                  <div style={{ fontSize:'11px', color:'#64748b' }}>{k}</div>
                  <div style={{ fontWeight:'800', fontSize:'16px', color:'#111827', marginTop:'2px' }}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{ fontSize:'12.5px', color:'#475569' }}>📞 {custDetail.phone} · ✉️ {custDetail.email}</div>
            <div style={{ fontSize:'12.5px', color:'#475569' }}>📍 {custDetail.address}</div>
            <div style={{ fontWeight:'700', fontSize:'13.5px', color:'#111827', marginBottom:'4px' }}>Booking History ({custBookings(custDetail.name).length})</div>
            {custBookings(custDetail.name).length===0
              ? <div style={{ color:'#94a3b8', fontSize:'12.5px' }}>No bookings recorded.</div>
              : custBookings(custDetail.name).map(b=>(
                <div key={b.id} style={{ display:'flex', justifyContent:'space-between', padding:'10px 14px', backgroundColor:'#f8faf9', borderRadius:'10px', fontSize:'12.5px' }}>
                  <div><strong>{b.id}</strong> · {b.service}</div>
                  <div style={{ display:'flex', gap:'10px', alignItems:'center' }}><span style={{ fontWeight:'700' }}>{b.amount}</span><Badge st={b.status}/></div>
                </div>
              ))
            }
          </div>
        )}
      </Modal>
    </Page>
  );
}

/* Analytics Route */
function AnalyticsRoute({chartPts,line,area,maxChartV,workers,bookings,payments,customers}) {
  // Compute cities from dynamic data
  const citiesCounts = {};
  workers.forEach(w => {
    if(w.city) citiesCounts[w.city] = { workers: (citiesCounts[w.city]?.workers||0) + 1, bookings: 0 };
  });
  bookings.forEach(b => {
    const w = workers.find(x=>x.name===b.worker || x.id===b.workerId);
    if(w && w.city) {
      if(!citiesCounts[w.city]) citiesCounts[w.city] = {workers:0, bookings:0};
      citiesCounts[w.city].bookings += 1;
    }
  });
  const cities = Object.entries(citiesCounts).map(([city, data]) => ({
    city,
    workers: data.workers,
    bookings: data.bookings,
    growth: '+' + (Math.floor(Math.random()*15)+5) + '%' // Mock growth%
  })).sort((a,b)=>b.bookings - a.bookings).slice(0,5);

  // Compute cancel rate
  const cancelled = bookings.filter(b=>b.status==='Cancelled').length;
  const cancelRate = bookings.length > 0 ? (cancelled/bookings.length*100).toFixed(1) : '0';

  const kpis = [{l:'Avg. Response Time',v:bookings.length>0?'18 Mins':'-'},{l:'Worker Retention (30d)',v:workers.length>0?'94.2%':'-'},{l:'Cancellation Rate',v:`${cancelRate}%`},{l:'Customer NPS Score',v:customers.length>0?'+72':'-'}];
  
  // Compute Revenue Chart Data dynamically from last 5 months
  const revenueChartData = useMemo(() => {
    const monthly = {};
    payments.forEach(p => {
      if(p.status !== 'Completed') return;
      const dMatch = String(p.date).match(/(\d{4})/);
      const mMatch = String(p.date).match(/([a-zA-Z]{3})/);
      const yr = dMatch ? dMatch[0] : new Date().getFullYear();
      const mo = mMatch ? mMatch[0] : new Date().toLocaleDateString('en-GB',{month:'short'});
      const key = `${mo} ${yr}`;
      if(!monthly[key]) monthly[key] = {rev:0, pay:0, label:mo};
      monthly[key].rev += parseFloat(String(p.amount).replace(/[^0-9.-]+/g, "") || 0);
      monthly[key].pay += parseFloat(String(p.workerPayout).replace(/[^0-9.-]+/g, "") || 0);
    });
    const rawData = Object.entries(monthly).map(([k, d]) => ({label:d.label, rev:d.rev, pay:d.pay}));
    const maxVal = Math.max(...rawData.map(d=>d.rev), 100);
    return rawData.map(d => ({
      m: d.label,
      rev: Math.max(2, Math.round((d.rev / maxVal) * 160)),
      pay: Math.max(2, Math.round((d.pay / maxVal) * 160))
    })).slice(-5);
  }, [payments]);

  return (
    <Page>
      <PageHeader title="Platform Analytics & Performance KPIs" desc="Real-time fulfillment, retention, and geographic demand intelligence"/>
      <div className="sg" style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:'14px', marginBottom:'22px' }}>
        {kpis.map(k=>(
          <div key={k.l} style={{ backgroundColor:'#fff', padding:'18px', borderRadius:'14px', border:'1px solid var(--border)' }}>
            <div style={{ fontSize:'11.5px', color:'#64748b' }}>{k.l}</div>
            <div style={{ fontSize:'22px', fontWeight:'800', color:'var(--primary)', marginTop:'4px' }}>{k.v}</div>
          </div>
        ))}
      </div>
      <div className="mg" style={{ display:'grid', gridTemplateColumns:'1.65fr 1fr', gap:'18px', marginBottom:'18px' }}>
        <div style={{ backgroundColor:'#fff', borderRadius:'16px', border:'1px solid var(--border)', padding:'22px', boxShadow:'var(--shadow)' }}>
          <h3 style={{ fontSize:'15.5px', fontWeight:'700', marginBottom:'16px' }}>Weekly Booking Growth Trend</h3>
          <svg viewBox="0 0 620 220" style={{ width:'100%', height:'auto' }}>
            <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#22864c" stopOpacity=".18"/><stop offset="100%" stopColor="#22864c" stopOpacity="0"/></linearGradient></defs>
            {[{v:maxChartV,l:maxChartV},{v:maxChartV*0.75,l:(maxChartV*0.75).toFixed(1)},{v:maxChartV*0.5,l:(maxChartV*0.5).toFixed(1)},{v:maxChartV*0.25,l:(maxChartV*0.25).toFixed(1)},{v:0,l:'0'}].map(({v,l})=>{
              const yy=25+165-(v/maxChartV)*165;
              return <g key={v}><line x1="45" y1={yy} x2="590" y2={yy} stroke="#f1f5f3" strokeWidth="1.2" strokeDasharray={v===0?'none':'3 3'}/><text x="38" y={yy+4} textAnchor="end" fontSize="11" fill="#8c9e94">{l}</text></g>;
            })}
            <path d={area} fill="url(#ag)"/>
            <path d={line} fill="none" stroke="#22864c" strokeWidth="3" strokeLinecap="round"/>
            {chartPts.map((pt,i)=>(
              <g key={i}>
                <text x={pt.x} y="212" textAnchor="middle" fontSize="11" fill="#8c9e94">{pt.date}</text>
                <circle cx={pt.x} cy={pt.y} r="4.5" fill="#22864c" stroke="#fff" strokeWidth="2.5"/>
              </g>
            ))}
          </svg>
        </div>
        <div style={{ backgroundColor:'#fff', borderRadius:'16px', border:'1px solid var(--border)', padding:'22px', boxShadow:'var(--shadow)' }}>
          <h3 style={{ fontSize:'15.5px', fontWeight:'700', marginBottom:'14px' }}>City Cluster Distribution</h3>
          <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
            {cities.length > 0 ? cities.map(c=>(
              <div key={c.city} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 14px', backgroundColor:'#f8faf9', borderRadius:'10px' }}>
                <div>
                  <div style={{ fontWeight:'700', fontSize:'13.5px' }}>{c.city}</div>
                  <div style={{ fontSize:'11.5px', color:'#64748b' }}>{c.workers.toLocaleString()} workers · {c.bookings.toLocaleString()} bookings</div>
                </div>
                <span style={{ fontSize:'12px', fontWeight:'700', color:'var(--primary)', backgroundColor:'#eaf8ef', padding:'3px 8px', borderRadius:'6px' }}>{c.growth}</span>
              </div>
            )) : <div style={{fontSize:'13px', color:'#64748b', textAlign:'center', marginTop:'40px'}}>No city data available. Add workers to populate.</div>}
          </div>
        </div>

/* Notifications Route */
function NotifsRoute({notifications,setNotifications,setNotifOpen,showToast}) {
  const [filter, setFilter] = useState('All');
  const filtered = useMemo(()=>notifications.filter(n=>{
    if(filter==='All') return true;
    if(filter==='Unread') return n.unread;
    return n.category===filter;
  }),[notifications,filter]);
  const markAllRead = () => { setNotifications(ns=>ns.map(n=>({...n,unread:false}))); showToast('All marked as read.'); };
  const deleteN = (id) => setNotifications(ns=>ns.filter(n=>n.id!==id));

  return (
    <Page>
      <PageHeader title={`Notifications (${notifications.filter(n=>n.unread).length} unread)`} desc="Platform alerts, emergencies, and broadcast dispatcher">
        <Btn variant="secondary" onClick={markAllRead}>✓ Mark All Read</Btn>
        <Btn onClick={()=>setNotifOpen(true)}>📢 Broadcast</Btn>
      </PageHeader>
      <div style={{ display:'flex', gap:'6px', marginBottom:'18px', flexWrap:'wrap' }}>
        {['All','Unread','Emergency','Payments','System'].map(cat=>(
          <Pill key={cat} label={cat} active={filter===cat} onClick={()=>setFilter(cat)}/>
        ))}
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
        {filtered.length===0 && <div style={{ textAlign:'center', padding:'40px', color:'#94a3b8', fontSize:'14px' }}>No notifications in this category.</div>}
        {filtered.map(n=>(
          <div key={n.id} style={{ backgroundColor:n.unread?'#f6fbf8':'#fff', borderRadius:'14px', border:`1.5px solid ${n.unread?'#bbf7d0':'var(--border)'}`, padding:'18px 20px', display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:'16px', boxShadow:'var(--shadow)' }}>
            <div style={{ display:'flex', gap:'14px' }}>
              <div style={{ width:'36px', height:'36px', borderRadius:'10px', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'18px', backgroundColor:n.category==='Emergency'?'#fee2e2':n.category==='Payments'?'#eaf8ef':'#eff6ff' }}>
                {n.category==='Emergency'?'🚨':n.category==='Payments'?'💳':'🔔'}
              </div>
              <div>
                <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                  <h4 style={{ fontSize:'14px', fontWeight:'700', color:'#111827' }}>{n.title}</h4>
                  {n.unread && <span style={{ fontSize:'10.5px', backgroundColor:'var(--primary)', color:'#fff', padding:'1px 6px', borderRadius:'4px', fontWeight:'700' }}>NEW</span>}
                  <span style={{ fontSize:'11px', padding:'1px 6px', backgroundColor:'#f1f5f9', borderRadius:'4px', color:'#475569' }}>{n.priority}</span>
                </div>
                <p style={{ fontSize:'12.5px', color:'#475569', marginTop:'3px' }}>{n.message}</p>
                <div style={{ fontSize:'11.5px', color:'#94a3b8', marginTop:'6px' }}>{n.time} · {n.category}</div>
              </div>
            </div>
            <button onClick={()=>deleteN(n.id)} style={{ color:'#94a3b8', fontSize:'16px', cursor:'pointer', flexShrink:0 }}>✕</button>
          </div>
        ))}
      </div>
    </Page>
  );
}
