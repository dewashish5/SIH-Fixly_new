<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Soft Map Background Elements -->
    <linearGradient id="mapBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2faf5" />
      <stop offset="100%" stop-color="#e3f4ea" />
    </linearGradient>
    <linearGradient id="workerShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ca45b" />
      <stop offset="100%" stop-color="#1e7e45" />
    </linearGradient>
    <linearGradient id="workerCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#248f4d" />
      <stop offset="100%" stop-color="#186738" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e7e45" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Terrain / Road vectors -->
  <path d="M -10 180 Q 80 140 160 190 T 320 160 T 420 180" fill="none" stroke="#d5ebd9" stroke-width="28" stroke-linecap="round" opacity="0.6"/>
  <path d="M 40 -10 Q 120 80 100 180 T 160 260" fill="none" stroke="#d5ebd9" stroke-width="20" stroke-linecap="round" opacity="0.4"/>
  <path d="M 220 20 Q 280 90 340 80 T 420 120" fill="none" stroke="#d5ebd9" stroke-width="16" stroke-linecap="round" opacity="0.4"/>

  <!-- Background Soft Green Land blobs -->
  <path d="M 20 80 C 60 40, 140 60, 160 110 C 180 160, 100 200, 50 190 C 10 180, -10 120, 20 80 Z" fill="#ebf7ee" opacity="0.7"/>
  <path d="M 280 40 C 330 10, 390 30, 390 80 C 390 130, 320 140, 290 120 C 260 100, 240 60, 280 40 Z" fill="#e2f5e8" opacity="0.6"/>

  <!-- Live Map Pins with Pulsing effect -->
  <!-- Pin 1 (Top Left) -->
  <g transform="translate(100, 75)">
    <circle cx="0" cy="0" r="14" fill="#22864c" opacity="0.18" />
    <path d="M 0,-16 C -8,-16 -12,-10 -12,-3 C -12,6 0,16 0,16 C 0,16 12,6 12,-3 C 12,-10 8,-16 0,-16 Z" fill="#22864c"/>
    <circle cx="0" cy="-5" r="4.5" fill="#ffffff"/>
    <circle cx="0" cy="-5" r="2.5" fill="#22864c"/>
  </g>

  <!-- Pin 2 (Center Left) -->
  <g transform="translate(170, 95)">
    <circle cx="0" cy="0" r="15" fill="#22864c" opacity="0.18" />
    <path d="M 0,-16 C -8,-16 -12,-10 -12,-3 C -12,6 0,16 0,16 C 0,16 12,6 12,-3 C 12,-10 8,-16 0,-16 Z" fill="#22864c"/>
    <circle cx="0" cy="-5" r="4.5" fill="#ffffff"/>
    <circle cx="0" cy="-5" r="2.5" fill="#22864c"/>
  </g>

  <!-- Pin 3 (Far Right) -->
  <g transform="translate(370, 115)">
    <circle cx="0" cy="0" r="14" fill="#e67e22" opacity="0.2" />
    <path d="M 0,-16 C -8,-16 -12,-10 -12,-3 C -12,6 0,16 0,16 C 0,16 12,6 12,-3 C 12,-10 8,-16 0,-16 Z" fill="#e67e22"/>
    <circle cx="0" cy="-5" r="4.5" fill="#ffffff"/>
    <circle cx="0" cy="-5" r="2.5" fill="#e67e22"/>
  </g>

  <!-- Worker Character Illustration -->
  <g transform="translate(300, 120)">
    <!-- Body / Torso -->
    <path d="M -45,70 C -45,30 -25,15 0,15 C 25,15 45,30 45,70 C 45,120 -45,120 -45,70 Z" fill="url(#workerShirt)"/>
    <!-- Collar -->
    <path d="M -15,16 L 0,32 L 15,16 L 10,13 L 0,22 L -10,13 Z" fill="#145a30"/>
    <polygon points="-12,15 0,30 12,15 0,20" fill="#ffffff" opacity="0.9"/>
    
    <!-- ID badge on chest -->
    <rect x="-24" y="32" width="12" height="15" rx="2" fill="#ffffff" />
    <rect x="-22" y="35" width="8" height="4" fill="#22864c" />
    <line x1="-22" y1="41" x2="-16" y2="41" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-22" y1="44" x2="-14" y2="44" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Left Hand (Pointing to map/left) -->
    <!-- Arm -->
    <path d="M -35,28 C -55,30 -75,45 -95,50 C -98,51 -105,45 -95,40 C -75,30 -50,18 -30,16 Z" fill="#d97746"/>
    <!-- Pointing Finger Hand -->
    <g transform="translate(-95, 46)">
      <!-- Palm -->
      <ellipse cx="-4" cy="0" rx="8" ry="6" fill="#d97746"/>
      <!-- Extended index finger -->
      <path d="M -4,-3 C -14,-4 -24,-2 -26,-5 C -27,-8 -22,-9 -12,-7 L -4,-6 Z" fill="#d97746"/>
      <!-- Other curled fingers -->
      <circle cx="-3" cy="3" r="3.5" fill="#bf6030"/>
      <circle cx="-1" cy="5" r="3" fill="#bf6030"/>
      <!-- Thumb -->
      <path d="M -5,-5 C -7,-10 -2,-12 0,-7 Z" fill="#bf6030"/>
    </g>

    <!-- Right Hand (resting or holding clipboard/phone) -->
    <path d="M 35,28 C 45,40 50,55 42,75 C 38,85 28,78 30,68 C 34,55 30,42 24,20 Z" fill="#d97746"/>
    <ellipse cx="38" cy="74" rx="7" ry="6" fill="#d97746"/>

    <!-- Neck -->
    <rect x="-10" y="0" width="20" height="20" rx="4" fill="#d97746"/>

    <!-- Head -->
    <ellipse cx="0" cy="-6" rx="21" ry="24" fill="#e28654"/>
    
    <!-- Ears -->
    <ellipse cx="-20" cy="-5" rx="4.5" ry="7" fill="#d97746"/>
    <ellipse cx="20" cy="-5" rx="4.5" ry="7" fill="#d97746"/>

    <!-- Hair sideburns -->
    <path d="M -18,-15 C -20,-8 -19,0 -16,4 L -18,-5 Z" fill="#2d1b10"/>
    <path d="M 18,-15 C 20,-8 19,0 16,4 L 18,-5 Z" fill="#2d1b10"/>

    <!-- Facial Features: Friendly Smile -->
    <!-- Eyes -->
    <circle cx="-7" cy="-7" r="2.8" fill="#1e1e1e"/>
    <circle cx="7" cy="-7" r="2.8" fill="#1e1e1e"/>
    <circle cx="-6" cy="-8.5" r="1" fill="#ffffff"/>
    <circle cx="8" cy="-8.5" r="1" fill="#ffffff"/>
    
    <!-- Eyebrows -->
    <path d="M -12,-13 Q -7,-16 -2,-13" fill="none" stroke="#2d1b10" stroke-width="2" stroke-linecap="round"/>
    <path d="M 2,-13 Q 7,-16 12,-13" fill="none" stroke="#2d1b10" stroke-width="2" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 0,-6 L -1,-1 L 2,0" fill="none" stroke="#c46838" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wide Friendly Smile with teeth -->
    <path d="M -8,5 Q 0,13 8,5 Z" fill="#ffffff"/>
    <path d="M -9,5 Q 0,15 9,5" fill="none" stroke="#8b2500" stroke-width="2" stroke-linecap="round"/>

    <!-- Green Cap -->
    <path d="M -23,-12 C -24,-34 24,-34 23,-12 Z" fill="url(#workerCap)"/>
    <!-- Cap Visor / Brim (angled forward/left) -->
    <path d="M -30,-10 C -25,-16 0,-18 18,-12 C 10,-8 -12,-6 -30,-10 Z" fill="#145a30"/>
    <!-- Cap button & seam -->
    <circle cx="0" cy="-33" r="3" fill="#145a30"/>
    <line x1="0" y1="-33" x2="0" y2="-15" stroke="#145a30" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
