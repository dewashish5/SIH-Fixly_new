services:
  mongo:
    image: mongo:7
    container_name: fixly-mongo
    ports:
      - "27017:27017"
    volumes:
      - fixly_mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fixly-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  fixly_mongo_data:
